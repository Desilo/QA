name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - DCR

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and pull code
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ywj/QA
            git pull origin DCR